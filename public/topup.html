<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topup Game — Austin Store</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/fa/css/all.min.css" id="fa-local">
  <script>
    document.querySelector('#fa-local') && (function(){
      var t=document.querySelector('link[href*="jsdelivr"][href*="fontawesome"]');
      t&&t.addEventListener('load',function(){var l=document.getElementById('fa-local');l&&l.parentNode.removeChild(l);});
    })();
  </script>
  <style>
    .order-search { position: relative; margin-bottom: 20px; }
    .order-search input {
      width: 100%; padding: 13px 16px 13px 44px; border-radius: var(--radius-sm);
      border: var(--border-w) solid var(--border-soft); background: var(--bg-card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); color: var(--text);
      font-size: 14px;
    }
    .order-search input:focus { outline: none; border-color: var(--primary); box-shadow: var(--glow); }
    .order-search i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 8px; }
    .cat-tile {
      background: var(--bg-card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--border-w) solid var(--border-soft); border-radius: var(--radius);
      overflow: hidden; text-align: center; cursor: pointer; box-shadow: var(--shadow);
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .cat-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
    .cat-tile .cover { width: 100%; aspect-ratio: 1/1; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--primary); }
    .cat-tile .cover img { width: 100%; height: 100%; object-fit: cover; }
    .cat-tile h4 { font-size: 11.5px; font-weight: 700; padding: 8px 6px; line-height: 1.3; }

    @media (max-width: 480px) {
      .cat-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .cat-tile h4 { font-size: 10.5px; padding: 7px 4px; }
    }

    .variant-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .variant-tile {
      background: var(--bg-card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 12px; text-align: center; cursor: pointer; box-shadow: var(--shadow);
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .variant-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
    .variant-tile h4 { font-size: 13.5px; font-weight: 700; }
    .variant-tile .count { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .item-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--bg-card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .15s;
    }
    .item-row:hover { border-color: var(--primary); transform: translateX(2px); }
    .item-row .item-name { font-weight: 600; font-size: 14px; }
    .item-row .item-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
    .item-row .item-price { font-family: var(--font-mono); font-weight: 700; color: var(--primary); white-space: nowrap; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state i { font-size: 40px; margin-bottom: 14px; display: block; }

    .cat-breadcrumb-nav { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    .cat-breadcrumb-nav a { color: var(--primary); cursor: pointer; font-weight: 600; }
    .cat-breadcrumb-nav a:hover { text-decoration: underline; }

    .level { display: none; }
    .level.active { display: block; }
  </style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon"><i class="fas fa-store"></i></div>
        <span>Austin Store</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu Utama</div>
      <div class="nav-item" data-href="/dashboard"><span class="nav-icon"><i class="fas fa-home"></i></span> Dashboard</div>
      <div class="nav-item" data-href="/order"><span class="nav-icon"><i class="fas fa-cart-shopping"></i></span> Marketplace</div>
      <div class="nav-item active" data-href="/topup"><span class="nav-icon"><i class="fas fa-bolt"></i></span> Topup Game</div>
      <div class="nav-item" data-href="/ppob"><span class="nav-icon"><i class="fas fa-receipt"></i></span> PPOB</div>
      <div class="nav-item" data-href="/sosmed"><span class="nav-icon"><i class="fas fa-share-nodes"></i></span> Sosial Media</div>
      <div class="nav-item" data-href="/nokos"><span class="nav-icon"><i class="fas fa-sim-card"></i></span> Nomor OTP</div>
      <div class="nav-item" data-href="/appprem"><span class="nav-icon"><i class="fas fa-crown"></i></span> App Premium</div>
      <div class="nav-item" data-href="/bansos"><span class="nav-icon"><i class="fas fa-gift"></i></span> Bansos Austin</div>
      <div class="nav-item" data-href="/subdomain"><span class="nav-icon"><i class="fas fa-globe"></i></span> Subdomain</div>
      <div class="nav-item" data-href="/panel"><span class="nav-icon"><i class="fas fa-server"></i></span> Panel Pterodactyl</div>
      <div class="nav-item" data-href="/leaderboard"><span class="nav-icon"><i class="fas fa-trophy"></i></span> Leaderboard</div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" data-user-avatar></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" data-user-name>...</div>
          <div class="sidebar-user-role" data-user-role>Member</div>
        </div>
      </div>
      <div class="nav-item mt-8" data-logout style="color:var(--danger)"><span class="nav-icon"><i class="fas fa-sign-out-alt"></i></span> Keluar</div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
      <div class="topbar-title">Topup Game</div>
      <div class="topbar-actions">
        <span class="badge badge-primary" style="font-family:var(--font-mono)" data-balance>Rp 0</span>
        <div class="notif-bell-wrapper" id="topbar-chat-wrapper">
          <button class="btn-icon" id="topbar-chat-btn" onclick="location.href='/messages'" title="Pesan Jual Beli"><i class="fas fa-comment-dots"></i></button>
          <span class="notif-badge" id="chat-unread-badge"></span>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="order-search" id="level-cat-search">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Cari game (Mobile Legends, Free Fire, PUBG, dll)...">
      </div>

            <div class="level active" id="level-cat">
        <div class="section-row" id="popular-section" style="margin:0 0 10px;display:none">
          <div><span class="eyebrow">Topup</span><h2 style="font-size:17px">Game Populer</h2></div>
        </div>
        <div class="cat-grid" id="popular-grid" style="margin-bottom:26px"></div>

        <div class="section-row" style="margin:0 0 10px">
          <div><span class="eyebrow">Topup</span><h2 style="font-size:17px">Pilih Game</h2></div>
        </div>
        <div class="cat-grid" id="cat-grid"><div class="loading-spinner"></div></div>
      </div>

            <div class="level" id="level-variant">
        <div id="variant-breadcrumb"></div>
        <div class="card-header" style="padding:0 0 14px 0;border:none">
          <span class="card-title" id="variant-heading"></span>
          <button class="btn btn-outline btn-sm" data-back="cat"><i class="fas fa-arrow-left"></i> Kembali</button>
        </div>
        <div class="variant-grid" id="variant-grid"></div>
      </div>

            <div class="level" id="level-item">
        <div id="item-breadcrumb"></div>
        <div class="card-header" style="padding:0 0 14px 0;border:none">
          <span class="card-title" id="item-heading"></span>
          <button class="btn btn-outline btn-sm" data-back="variant"><i class="fas fa-arrow-left"></i> Kembali</button>
        </div>
        <div class="item-list" id="item-list"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="order-modal-overlay">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title"><i class="fas fa-bolt" style="color:var(--primary);margin-right:8px"></i>Isi Data Tujuan</span>
      <button class="modal-close" id="order-modal-close">&times;</button>
    </div>
    <div class="modal-body" id="order-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="order-modal-cancel">Batal</button>
      <button class="btn btn-primary" id="order-modal-confirm"><i class="fas fa-bolt"></i> Order</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="result-modal-overlay">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title"><i class="fas fa-circle-check" style="color:var(--success);margin-right:8px"></i>Order Terkirim</span>
      <button class="modal-close" id="result-modal-close">&times;</button>
    </div>
    <div class="modal-body" id="result-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-full" id="result-modal-ok">Selesai</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="terms-modal-overlay">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <span class="modal-title" id="terms-modal-title"><i class="fas fa-circle-info" style="color:var(--primary);margin-right:8px"></i>Ketentuan</span>
      <button class="modal-close" id="terms-modal-close">&times;</button>
    </div>
    <div class="modal-body" id="terms-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-full" id="terms-modal-ok">Tutup</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/custom-select.js"></script>
<script>
let topupCategories = [];
let currentCategory = null; 
let currentVariants = [];
let currentVariant = null; 
let currentItems = [];
let selectedItem = null; 

async function init() {
  const res = await Auth.checkOptional();
  if (res) { Auth.renderUserInfo(res.user, res.wallet); } else { Auth.renderGuestUI(); }

  const data = await API.get('/api/topup/categories');
  if (!data.success || !data.data.length) {
    document.getElementById('cat-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-gamepad"></i>Belum ada game topup tersedia</div>`;
    return;
  }
  topupCategories = data.data;
  renderPopular(topupCategories);
  renderCategories(topupCategories);

  history.replaceState({ level: 'cat' }, '', location.href);

  const params = new URLSearchParams(location.search);
  const openKey = params.get('open');
  if (openKey) {
    const cat = topupCategories.find(c => c.key === openKey);
    if (cat) openCategory(cat);
  }
}

function renderPopular(list) {
  const popular = list.filter(c => c.popular);
  const section = document.getElementById('popular-section');
  const grid = document.getElementById('popular-grid');
  if (!popular.length) {
    section.style.display = 'none';
    grid.innerHTML = '';
    return;
  }
  section.style.display = '';
  grid.innerHTML = popular.map(c => `
    <div class="cat-tile" data-key="${escapeAttr(c.key)}">
      <div class="cover">${c.image ? `<img src="${escapeAttr(c.image)}" alt="${escapeAttr(c.name)}">` : `<i class="fas fa-${escapeAttr(c.icon || 'gamepad')}"></i>`}</div>
      <h4>${escapeHtml(c.name)}</h4>
    </div>
  `).join('');
  grid.querySelectorAll('.cat-tile').forEach(el => {
    el.addEventListener('click', () => {
      const cat = topupCategories.find(c => c.key === el.dataset.key);
      if (cat) openCategory(cat);
    });
  });
}

function showLevel(name) {
  document.querySelectorAll('.level').forEach(el => el.classList.remove('active'));
  document.getElementById(`level-${name}`).classList.add('active');
  document.getElementById('level-cat-search').style.display = name === 'cat' ? 'block' : 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderCategories(list) {
  const grid = document.getElementById('cat-grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-magnifying-glass"></i>Game tidak ditemukan</div>`;
    return;
  }
  grid.innerHTML = list.map(c => `
    <div class="cat-tile" data-key="${escapeAttr(c.key)}">
      <div class="cover">${c.image ? `<img src="${escapeAttr(c.image)}" alt="${escapeAttr(c.name)}">` : `<i class="fas fa-${escapeAttr(c.icon || 'gamepad')}"></i>`}</div>
      <h4>${escapeHtml(c.name)}</h4>
    </div>
  `).join('');
  grid.querySelectorAll('.cat-tile').forEach(el => {
    el.addEventListener('click', () => {
      const cat = topupCategories.find(c => c.key === el.dataset.key);
      if (cat) openCategory(cat);
    });
  });
}

document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.getElementById('popular-section').style.display = q ? 'none' : (topupCategories.some(c => c.popular) ? '' : 'none');
  document.getElementById('popular-grid').style.display = q ? 'none' : '';
  renderCategories(q ? topupCategories.filter(c => c.name.toLowerCase().includes(q)) : topupCategories);
});

async function openCategory(cat, push = true) {
  currentCategory = cat;
  showLevel('variant');
  if (push) history.pushState({ level: 'variant', catKey: cat.key }, '', location.href);
  document.getElementById('variant-heading').textContent = cat.name;
  document.getElementById('variant-breadcrumb').innerHTML = `<div class="cat-breadcrumb-nav"><a data-back="cat">Pilih Game</a> <span>/</span> <span>${escapeHtml(cat.name)}</span></div>`;
  document.getElementById('variant-grid').innerHTML = '<div class="loading-spinner"></div>';

  const res = await API.get(`/api/topup/categories/${encodeURIComponent(cat.key)}/variants`);
  const grid = document.getElementById('variant-grid');
  if (!res.success || !res.data.variants.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-box-open"></i>${escapeHtml(res.message || 'Belum ada server/region tersedia')}</div>`;
    return;
  }
  currentCategory = { ...cat, inputMode: res.data.category.inputMode, fields: res.data.category.fields, notice: res.data.category.notice, termsTitle: res.data.category.termsTitle, terms: res.data.category.terms };
  currentVariants = res.data.variants;
  grid.innerHTML = currentVariants.map(v => `
    <div class="variant-tile" data-slug="${escapeAttr(v.slug)}">
      <h4>${escapeHtml(v.game)}</h4>
      <div class="count">${v.count} item tersedia</div>
    </div>
  `).join('');
  grid.querySelectorAll('.variant-tile').forEach(el => {
    el.addEventListener('click', () => {
      const v = currentVariants.find(x => x.slug === el.dataset.slug);
      if (v) openVariant(v);
    });
  });
}

async function openVariant(variant, push = true) {
  currentVariant = variant;
  showLevel('item');
  if (push) history.pushState({ level: 'item', catKey: currentCategory.key, variantSlug: variant.slug }, '', location.href);
  document.getElementById('item-heading').textContent = variant.game;
  document.getElementById('item-breadcrumb').innerHTML = `<div class="cat-breadcrumb-nav"><a data-back="cat">Pilih Game</a> <span>/</span> <a data-back="variant">${escapeHtml(currentCategory.name)}</a> <span>/</span> <span>${escapeHtml(variant.game)}</span></div>`;
  document.getElementById('item-list').innerHTML = '<div class="loading-spinner"></div>';

  const res = await API.get(`/api/topup/categories/${encodeURIComponent(currentCategory.key)}/variants/${encodeURIComponent(variant.slug)}/items`);
  const list = document.getElementById('item-list');
  if (!res.success || !res.data.items.length) {
    list.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i>${escapeHtml(res.message || 'Belum ada item tersedia')}</div>`;
    return;
  }
  currentItems = res.data.items;
  list.innerHTML = currentItems.map(it => `
    <div class="item-row" data-code="${escapeAttr(it.code)}">
      <div>
        <div class="item-name">${escapeHtml(it.name)}</div>
        ${it.description ? `<div class="item-desc">${escapeHtml((() => { const d = it.description.replace(/\n+/g, ' • '); return d.length > 200 ? d.slice(0, 200) + '...' : d; })())}</div>` : ''}
      </div>
      <div class="item-price">${formatRupiah(it.price)}</div>
    </div>
  `).join('');
  list.querySelectorAll('.item-row').forEach(el => {
    el.addEventListener('click', () => {
      const it = currentItems.find(x => x.code === el.dataset.code);
      if (it) openOrderModal(it);
    });
  });
}

document.body.addEventListener('click', (e) => {
  const back = e.target.closest('[data-back]');
  if (!back) return;
  if (back.dataset.back === 'cat') {
    const activeLevel = document.querySelector('.level.active')?.id;
    history.go(activeLevel === 'level-item' ? -2 : -1);
  } else if (back.dataset.back === 'variant') {
    history.go(-1);
  }
});

window.addEventListener('popstate', (e) => {
  const state = e.state || { level: 'cat' };
  if (state.level === 'variant' && state.catKey) {
    if (currentCategory && currentCategory.key === state.catKey && currentVariants.length) {
      showLevel('variant');
      return;
    }
    const cat = topupCategories.find(c => c.key === state.catKey);
    if (cat) { openCategory(cat, false); return; }
    showLevel('cat');
    return;
  }
  if (state.level === 'item' && state.variantSlug) {
    if (currentVariant && currentVariant.slug === state.variantSlug && currentItems.length) {
      showLevel('item');
      return;
    }
    const cat = topupCategories.find(c => c.key === state.catKey) || currentCategory;
    if (cat) {
      currentCategory = cat;
      const v = currentVariants.find(x => x.slug === state.variantSlug);
      if (v) { openVariant(v, false); return; }
    }
    showLevel('cat');
    return;
  }
  showLevel('cat');
});

function openOrderModal(item) {
  selectedItem = item;
  const cat = currentCategory;
  const fields = cat.fields && cat.fields.length ? cat.fields : [{ key: 'target_id', label: 'User ID', placeholder: 'Masukkan User ID', type: 'text', required: true }];

  const fieldsHtml = fields.map((f) => {
    if (f.type === 'textarea') {
      return `
        <div class="form-group">
          <label class="form-label">${escapeHtml(f.label)}</label>
          <textarea class="form-control" id="topup-field-${f.key}" rows="3" placeholder="${escapeAttr(f.placeholder)}"></textarea>
        </div>`;
    }
    if (f.type === 'select') {
      const optionsHtml = (f.options || []).map((o) =>
        `<option value="${escapeAttr(o.value)}">${escapeHtml(o.label)}</option>`
      ).join('');
      return `
        <div class="form-group">
          <label class="form-label">${escapeHtml(f.label)}</label>
          <select class="form-control" id="topup-field-${f.key}">
            <option value="" disabled selected>${escapeAttr(f.placeholder || 'Pilih')}</option>
            ${optionsHtml}
          </select>
        </div>`;
    }
    if (f.type === 'searchable_select') {
      const listId = `topup-datalist-${f.key}`;
      const optionsHtml = (f.options || []).map((o) => `<option value="${escapeAttr(o.value)}">`).join('');
      return `
        <div class="form-group">
          <label class="form-label">${escapeHtml(f.label)}</label>
          <input type="text" class="form-control" id="topup-field-${f.key}" list="${listId}" placeholder="${escapeAttr(f.placeholder)}" autocomplete="off">
          <datalist id="${listId}">${optionsHtml}</datalist>
        </div>`;
    }
    if (f.type === 'nickname_display') {
      return `
        <div class="form-group">
          <label class="form-label">${escapeHtml(f.label)}</label>
          <div style="display:flex;gap:8px">
            <input type="text" class="form-control" id="topup-field-${f.key}" placeholder="${escapeAttr(f.placeholder)}" readonly style="flex:1;background:var(--bg-alt,#f4f4f5)">
            <button type="button" class="btn btn-secondary" id="topup-check-nickname-btn" style="white-space:nowrap">Cek Nickname</button>
          </div>
        </div>`;
    }
    return `
      <div class="form-group">
        <label class="form-label">${escapeHtml(f.label)}</label>
        <input type="${f.type === 'password' ? 'password' : 'text'}" class="form-control" id="topup-field-${f.key}" placeholder="${escapeAttr(f.placeholder)}">
      </div>`;
  }).join('');

  const hasMandatoryNicknameField = fields.some((f) => f.type === 'nickname_display');
  const supportsOptionalNicknameCheck =
    !hasMandatoryNicknameField &&
    cat.inputMode !== 'login' &&
    cat.inputMode !== 'joki' &&
    fields.some((f) => f.key === 'target_id');

  const optionalNicknameHtml = supportsOptionalNicknameCheck ? `
    <div class="form-group">
      <label class="form-label">Nickname (opsional, buat mastiin ID benar)</label>
      <div style="display:flex;gap:8px">
        <input type="text" class="form-control" id="topup-optional-nickname-display" placeholder="Tekan &quot;Cek Nickname&quot; buat verifikasi" readonly style="flex:1;background:var(--bg-alt,#f4f4f5)">
        <button type="button" class="btn btn-secondary" id="topup-optional-nickname-btn" style="white-space:nowrap">Cek Nickname</button>
      </div>
    </div>` : '';

  const noticeHtml = (cat.notice && cat.notice.length) ? `
    <div class="card" style="padding:14px;margin-bottom:14px;border-color:var(--primary);background:var(--primary-light)">
      ${cat.notice.map((n) => `<div style="display:flex;gap:8px;font-size:12.5px;line-height:1.5;margin-bottom:6px"><i class="fas fa-chevron-right" style="color:var(--primary);margin-top:3px;font-size:10px"></i><span>${escapeHtml(n)}</span></div>`).join('')}
      ${cat.terms && cat.terms.length ? `<a href="#" id="topup-open-terms" style="font-size:12.5px;font-weight:700;color:var(--primary);text-decoration:underline">${escapeHtml(cat.termsTitle || 'Lihat Ketentuan Lengkap')} (klik disini)</a>` : ''}
    </div>` : '';

  document.getElementById('order-modal-body').innerHTML = `
    <div class="card" style="padding:14px;border-color:var(--primary);margin-bottom:14px">
      <div style="font-weight:700">${escapeHtml(item.name)}</div>
      <div style="margin-top:6px;font-family:var(--font-mono);font-weight:700;color:var(--primary);font-size:18px">${formatRupiah(item.price)}</div>
    </div>
    ${noticeHtml}
    ${fieldsHtml}
    ${optionalNicknameHtml}
    <div class="form-group">
      <label class="form-label">Kode Voucher (opsional)</label>
      <input type="text" class="form-control" id="topup-voucher-code" placeholder="Masukkan kode voucher" style="text-transform:uppercase">
    </div>
    <p style="margin-top:6px;font-size:12px;color:var(--text-muted)"><i class="fas fa-circle-info"></i> Saldo akan langsung terpotong dan order diteruskan otomatis ke server game.</p>
  `;
  document.getElementById('order-modal-overlay').classList.add('open');

  const openTermsLink = document.getElementById('topup-open-terms');
  if (openTermsLink) {
    openTermsLink.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('terms-modal-title').textContent = cat.termsTitle || 'Ketentuan';
      document.getElementById('terms-modal-body').innerHTML = (cat.terms || [])
        .map((t) => `<div style="display:flex;gap:8px;font-size:13px;line-height:1.6;margin-bottom:10px"><span style="color:var(--primary)">&bull;</span><span>${escapeHtml(t)}</span></div>`).join('');
      document.getElementById('terms-modal-overlay').classList.add('open');
    });
  }

  const nicknameBtn = document.getElementById('topup-check-nickname-btn');
  if (nicknameBtn) {
    nicknameBtn.addEventListener('click', async () => {
      if (!Auth.requireLogin('Masuk dulu untuk cek nickname')) return;
      const targetEl = document.getElementById('topup-field-target_id');
      const zoneEl = document.getElementById('topup-field-zone_id');
      const nicknameField = fields.find((f) => f.type === 'nickname_display');
      const nicknameEl = document.getElementById(`topup-field-${nicknameField.key}`);
      const targetVal = targetEl ? targetEl.value.trim() : '';
      const zoneVal = zoneEl ? zoneEl.value.trim() : '';
      if (!targetVal) { Toast.error('User ID wajib diisi dulu'); return; }
      if (zoneEl && !zoneVal) { Toast.error('Server wajib dipilih dulu'); return; }

      nicknameBtn.classList.add('btn-loading');
      nicknameBtn.disabled = true;
      const res = await API.post('/api/topup/nickname', {
        category_key: cat.key,
        service_code: item.code,
        target_id: targetVal,
        zone_id: zoneVal,
      });
      nicknameBtn.classList.remove('btn-loading');
      nicknameBtn.disabled = false;

      if (!res.success) {
        nicknameEl.value = '';
        Toast.error(res.message || 'Nickname tidak ditemukan');
        return;
      }
      nicknameEl.value = res.data.nickname || '';
      Toast.success('Nickname ditemukan');
    });
  }

  const optionalNicknameBtn = document.getElementById('topup-optional-nickname-btn');
  if (optionalNicknameBtn) {
    optionalNicknameBtn.addEventListener('click', async () => {
      if (!Auth.requireLogin('Masuk dulu untuk cek nickname')) return;
      const targetEl = document.getElementById('topup-field-target_id');
      const zoneEl = document.getElementById('topup-field-zone_id');
      const displayEl = document.getElementById('topup-optional-nickname-display');
      const targetVal = targetEl ? targetEl.value.trim() : '';
      const zoneVal = zoneEl ? zoneEl.value.trim() : '';
      if (!targetVal) { Toast.error('User ID wajib diisi dulu'); return; }
      if (zoneEl && !zoneVal) { Toast.error('Zone/Server wajib diisi dulu'); return; }

      optionalNicknameBtn.classList.add('btn-loading');
      optionalNicknameBtn.disabled = true;
      const res = await API.post('/api/topup/nickname', {
        category_key: cat.key,
        service_code: item.code,
        target_id: targetVal,
        zone_id: zoneVal,
      });
      optionalNicknameBtn.classList.remove('btn-loading');
      optionalNicknameBtn.disabled = false;

      if (!res.success) {
        displayEl.value = '';
        Toast.error(res.message || 'Nickname tidak bisa dicek otomatis untuk game ini, pastikan ID sudah benar');
        return;
      }
      displayEl.value = res.data.nickname || '';
      Toast.success('Nickname ditemukan, pastikan sesuai akunmu ya');
    });
  }
}

document.getElementById('order-modal-close').addEventListener('click', () => document.getElementById('order-modal-overlay').classList.remove('open'));
document.getElementById('order-modal-cancel').addEventListener('click', () => document.getElementById('order-modal-overlay').classList.remove('open'));
document.getElementById('terms-modal-close').addEventListener('click', () => document.getElementById('terms-modal-overlay').classList.remove('open'));
document.getElementById('terms-modal-ok').addEventListener('click', () => document.getElementById('terms-modal-overlay').classList.remove('open'));

document.getElementById('order-modal-confirm').addEventListener('click', async (e) => {
  if (!Auth.requireLogin('Masuk dulu untuk melakukan order')) return;
  const cat = currentCategory;
  const fields = cat.fields && cat.fields.length ? cat.fields : [{ key: 'target_id', label: 'User ID', required: true }];
  const values = {};
  for (const f of fields) {
    const el = document.getElementById(`topup-field-${f.key}`);
    const val = el ? el.value.trim() : '';
    if (f.required && !val) { Toast.error(`${f.label} wajib diisi`); return; }
    if (f.type === 'searchable_select' && val) {
      const valid = (f.options || []).some((o) => o.value === val);
      if (!valid) { Toast.error(`${f.label} harus dipilih dari daftar yang tersedia`); return; }
    }
    values[f.key] = val;
  }

  e.target.classList.add('btn-loading');
  e.target.disabled = true;
  const res = await API.post('/api/topup/order', {
    category_key: cat.key,
    service_code: selectedItem.code,
    target_id: values.target_id,
    zone_id: values.zone_id,
    additional_data: values.additional_data,
    voucher_code: (document.getElementById('topup-voucher-code')?.value || '').trim() || undefined,
  });
  e.target.classList.remove('btn-loading');
  e.target.disabled = false;
  document.getElementById('order-modal-overlay').classList.remove('open');

  if (!res.success) {
    Toast.error(res.message || 'Order gagal');
    return;
  }
  Toast.success('Order berhasil dikirim!');
  document.getElementById('result-modal-body').innerHTML = `
    <p style="margin-bottom:10px"><b>${escapeHtml(selectedItem.name)}</b> — ${formatRupiah(res.data.price)}</p>
    <p style="font-size:12.5px;color:var(--text-muted)">TrxID: <code>${escapeHtml(res.data.trxid || '-')}</code></p>
    <p style="font-size:12.5px;color:var(--text-muted)">Status: <b>${escapeHtml(res.data.status || 'waiting')}</b></p>
    <p style="margin-top:10px;font-size:12px;color:var(--text-muted)"><i class="fas fa-circle-info"></i> Cek status terbaru kapan saja di menu Riwayat.</p>
  `;
  document.getElementById('result-modal-overlay').classList.add('open');

  const meRes = await Auth.checkOptional();
  if (meRes) Auth.renderUserInfo(meRes.user, meRes.wallet);
});

document.getElementById('result-modal-close').addEventListener('click', () => document.getElementById('result-modal-overlay').classList.remove('open'));
document.getElementById('result-modal-ok').addEventListener('click', () => {
  document.getElementById('result-modal-overlay').classList.remove('open');
  showLevel('cat');
});

init();
</script>
</body>
</html>
