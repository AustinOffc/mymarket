<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Austin Store Marketplace</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/fa/css/all.min.css" id="fa-local">
  <script>
    document.querySelector('#fa-local') && (function(){
      var t=document.querySelector('link[href*="jsdelivr"][href*="fontawesome"]');
      t&&t.addEventListener('load',function(){var l=document.getElementById('fa-local');l&&l.parentNode.removeChild(l);});
    })();
  </script>
</head>
<body>
<div class="app-layout">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><div class="logo-icon"><i class="fas fa-store"></i></div><span>Austin Store</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu Utama</div>
      <div class="nav-item" data-href="/dashboard"><span class="nav-icon"><i class="fas fa-home"></i></span> Dashboard</div>
      <div class="nav-item" data-href="/order"><span class="nav-icon"><i class="fas fa-cart-shopping"></i></span> Marketplace</div>
      <div class="nav-item" data-href="/topup"><span class="nav-icon"><i class="fas fa-bolt"></i></span> Topup Game</div>
      <div class="nav-item" data-href="/sosmed"><span class="nav-icon"><i class="fas fa-share-nodes"></i></span> Sosial Media</div>
      <div class="nav-item" data-href="/nokos"><span class="nav-icon"><i class="fas fa-sim-card"></i></span> Nomor OTP</div>
      <div class="nav-item" data-href="/appprem"><span class="nav-icon"><i class="fas fa-crown"></i></span> App Premium</div>
      <div class="nav-item" data-href="/bansos"><span class="nav-icon"><i class="fas fa-gift"></i></span> Bansos Austin</div>
      <div class="nav-item" data-href="/subdomain"><span class="nav-icon"><i class="fas fa-globe"></i></span> Subdomain</div>
      <div class="nav-item" data-href="/panel"><span class="nav-icon"><i class="fas fa-server"></i></span> Panel Pterodactyl</div>
      <div class="nav-item active" data-href="/leaderboard"><span class="nav-icon"><i class="fas fa-trophy"></i></span> Leaderboard</div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" data-user-avatar></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" data-user-name>...</div>
          <div class="sidebar-user-role" data-user-role>Member</div>
        </div>
      </div>
      <div class="nav-item mt-8" data-logout style="color:#ef4444"><span class="nav-icon"><i class="fas fa-sign-out-alt"></i></span> Keluar</div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
      <div class="topbar-title">Leaderboard</div>
      <div class="topbar-actions">
        <div class="notif-bell-wrapper">
          <button class="btn-icon" id="notif-bell"><i class="fas fa-bell"></i></button>
          <span class="notif-badge" id="notif-badge"></span>
        </div>
        <button class="btn-icon" id="theme-toggle"><i class="fas fa-moon"></i></button>
        <div class="notif-bell-wrapper" id="topbar-chat-wrapper">
          <button class="btn-icon" id="topbar-chat-btn" onclick="location.href='/messages'" title="Pesan Jual Beli"><i class="fas fa-comment-dots"></i></button>
          <span class="notif-badge" id="chat-unread-badge"></span>
        </div>
      </div>
    </header>

    <div class="page-content">
            <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="tab-deposit" onclick="switchTab('deposit')"><i class="fas fa-crown"></i> Top Sultan</button>
        <button class="btn btn-outline btn-sm" id="tab-transactions" onclick="switchTab('transactions')"><i class="fas fa-cart-shopping"></i> Top Order</button>
      </div>

            <div class="card mb-16" id="my-rank-card" style="display:none">
        <div class="card-body" style="display:flex;align-items:center;gap:14px">
          <div id="my-rank-badge" style="width:44px;height:44px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0">-</div>
          <div>
            <div class="text-sm text-muted">Posisimu saat ini</div>
            <div style="font-weight:700" id="my-rank-text">-</div>
          </div>
        </div>
      </div>

            <div class="card">
        <div class="card-header">
          <span class="card-title" id="table-title">Top Sultan</span>
          <span class="text-muted text-sm" id="total-info"></span>
        </div>
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th style="width:70px">Rank</th>
                <th>Nama</th>
                <th style="text-align:right" id="value-col-label">Total Deposit</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="3"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script src="/js/cs.js"></script>
<script>
let currentTab = 'deposit';

const TABS = {
  deposit:      { label: 'Top Sultan', valueLabel: 'Total Deposit',    format: (v) => formatRupiah(v) },
  transactions: { label: 'Top Order',  valueLabel: 'Jumlah Transaksi', format: (v) => `${v}x` },
};

const RANK_STYLE = {
  1: { bg: '#fef3c7', color: '#92400e', icon: 'fa-trophy' },
  2: { bg: '#e5e7eb', color: '#374151', icon: 'fa-medal' },
  3: { bg: '#fed7aa', color: '#9a3412', icon: 'fa-medal' },
};

async function init() {
  const res = await Auth.check();
  if (!res) return;
  Auth.renderUserInfo(res.user, res.wallet);
  updateTabUI();
  loadData();
}

function switchTab(tab) {
  currentTab = tab;
  updateTabUI();
  loadData();
}

function updateTabUI() {
  Object.keys(TABS).forEach(t => {
    const btn = document.getElementById(`tab-${t}`);
    const icon = btn.querySelector('i').outerHTML;
    btn.className = t === currentTab ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
    btn.innerHTML = `${icon} ${TABS[t].label}`;
  });
  document.getElementById('table-title').textContent = TABS[currentTab].label;
  document.getElementById('value-col-label').textContent = TABS[currentTab].valueLabel;
}

function rankCell(rank) {
  const style = RANK_STYLE[rank];
  if (!style) return `<div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-muted)">${rank}</div>`;
  return `<div style="width:32px;height:32px;border-radius:50%;background:${style.bg};color:${style.color};display:flex;align-items:center;justify-content:center"><i class="fas ${style.icon}"></i></div>`;
}

async function loadData() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = `<tr><td colspan="3"><div class="loading-spinner"></div></td></tr>`;
  document.getElementById('my-rank-card').style.display = 'none';

  const res = await API.get(`/api/leaderboard?type=${currentTab}`);

  if (!res.success) {
    tbody.innerHTML = `<tr><td colspan="3" class="table-empty">Gagal memuat data</td></tr>`;
    return;
  }

  document.getElementById('total-info').textContent = `Top ${res.data.length}`;

  if (!res.data.length) {
    tbody.innerHTML = `<tr><td colspan="3"><div class="table-empty"><i class="fas fa-inbox" style="font-size:36px;margin-bottom:12px;display:block;color:var(--text-muted)"></i><p>Belum ada data</p></div></td></tr>`;
  } else {
    const fmt = TABS[currentTab].format;
    tbody.innerHTML = res.data.map(row => `
      <tr style="${row.is_me ? 'background:var(--primary-light)' : ''}">
        <td>${rankCell(row.rank)}</td>
        <td style="font-weight:${row.is_me ? '700' : '500'}">${escapeHtml(row.full_name)}${row.is_me ? ' <span class="badge badge-primary" style="margin-left:6px">Kamu</span>' : ''}</td>
        <td style="text-align:right;font-weight:700;color:var(--primary)">${fmt(row.value)}</td>
      </tr>
    `).join('');
  }

  if (res.my_rank) {
    const card = document.getElementById('my-rank-card');
    card.style.display = 'block';
    document.getElementById('my-rank-badge').textContent = `#${res.my_rank.rank}`;
    document.getElementById('my-rank-text').textContent =
      `Peringkat ${res.my_rank.rank} dari ${res.my_rank.total} — ${TABS[currentTab].format(res.my_rank.value)}`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

init();
</script>
</body>
</html>
